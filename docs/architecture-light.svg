<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1010" width="800" height="1010" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, Helvetica, Arial, sans-serif" role="img" aria-label="opProxy architecture">
