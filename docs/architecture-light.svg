<text x="96" y="476" font-size="16" font-weight="600" fill="#3D8A2A" text-anchor="middle">Lists only</text>
<text x="96" y="498" font-size="15" font-weight="400" fill="#6B6252" text-anchor="middle">always allowed</text>
<text x="96" y="528" font-size="14.5" font-weight="400" fill="#1F1B14" text-anchor="middle" font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace">item list</text>
<text x="96" y="549" font-size="14.5" font-weight="400" fill="#1F1B14" text-anchor="middle" font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace">vault list</text>
<text x="96" y="570" font-size="14.5" font-weight="400" fill="#1F1B14" text-anchor="middle" font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace">whoami</text>
<path d="M96,588 L96,830 Q96,842 108,842 L190,842" fill="none" stroke="#3D8A2A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m-grn)"/>
<rect x="192" y="420" width="252" height="180" rx="12" fill="#FFF6D6" stroke="#B07D00" stroke-width="2"/>
<text x="318" y="450" font-size="17" font-weight="600" fill="#8A6100" text-anchor="middle">Remembered approvals</text>
<text x="318" y="478" font-size="15" font-weight="400" fill="#1F1B14" text-anchor="middle">one item, for one agent</text>
<text x="318" y="500" font-size="15" font-weight="400" fill="#1F1B14" text-anchor="middle">or for all agents</text>
<text x="318" y="522" font-size="15" font-weight="400" fill="#1F1B14" text-anchor="middle">expires in 1 day, or never</text>
<text x="318" y="554" font-size="15" font-weight="400" fill="#6B6252" text-anchor="middle">signed by the Mac’s Secure</text>
<text x="318" y="576" font-size="15" font-weight="400" fill="#6B6252" text-anchor="middle">Enclave or a paired phone</text>
<line x1="216" y1="538" x2="420" y2="538" stroke="#B07D00" stroke-opacity="0.35"/>
<rect x="508" y="420" width="268" height="324" rx="12" fill="#FFFFFF" stroke="#D9CFBB" stroke-width="1.5"/>
<text x="526" y="450" font-size="17" font-weight="600" fill="#1F1B14" text-anchor="start">Ask you</text>
<text x="526" y="476" font-size="15" font-weight="400" fill="#6B6252" text-anchor="start">Mac dialog and paired iPhones</text>
<text x="526" y="498" font-size="15" font-weight="400" fill="#6B6252" text-anchor="start">(Secret Proxy app) at once;</text>
<text x="526" y="520" font-size="15" font-weight="400" fill="#6B6252" text-anchor="start">the first answer wins</text>
<rect x="520" y="542" width="244" height="56" rx="8" fill="#FFF6D6"/>
<rect x="520" y="542" width="4" height="56" rx="2" fill="#B07D00"/>
<text x="538" y="566" font-size="16" font-weight="600" fill="#8A6100" text-anchor="start">1 day or forever</text>
<text x="538" y="587" font-size="15" font-weight="400" fill="#6B6252" text-anchor="start">this agent or all agents</text>
<rect x="520" y="608" width="244" height="56" rx="8" fill="#EEF6E8"/>
<rect x="520" y="608" width="4" height="56" rx="2" fill="#3D8A2A"/>
<text x="538" y="632" font-size="16" font-weight="600" fill="#3D8A2A" text-anchor="start">Allow once</text>
<text x="538" y="653" font-size="15" font-weight="400" fill="#6B6252" text-anchor="start">nothing saved, asked again</text>
<rect x="520" y="674" width="244" height="56" rx="8" fill="#FBECEA"/>
<rect x="520" y="674" width="4" height="56" rx="2" fill="#C2392E"/>
<text x="538" y="698" font-size="16" font-weight="600" fill="#C2392E" text-anchor="start">Deny</text>
<text x="538" y="719" font-size="15" font-weight="400" fill="#6B6252" text-anchor="start">or no answer in 5 minutes</text>
<path d="M444,446 L506,446" fill="none" stroke="#B07D00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m-acc)"/>
<text x="476.0" y="438" font-size="15" font-weight="400" fill="#6B6252" text-anchor="middle">no</text>
<path d="M520,570 L446,570" fill="none" stroke="#B07D00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m-acc)"/>
<text x="476.0" y="562" font-size="15" font-weight="400" fill="#8A6100" text-anchor="middle">saved</text>
<path d="M520,636 L392,636 Q380,636 380,648 L380,798" fill="none" stroke="#3D8A2A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m-grn)"/>
<path d="M278,600 L278,798" fill="none" stroke="#3D8A2A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m-grn)"/>
