<text x="332" y="400" font-size="14.5" font-weight="400" fill="#1F1B14" text-anchor="start" font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace">read · item get · document get</text>
<path d="M192,315 L108,315 Q96,315 96,327 L96,446" fill="none" stroke="#3D8A2A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m-grn)"/>
