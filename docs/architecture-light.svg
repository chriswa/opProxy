<rect x="580" y="792" width="124" height="42" rx="21" fill="#FBECEA" stroke="#C2392E" stroke-width="1.5"/>
<text x="642" y="818" font-size="16" font-weight="600" fill="#C2392E" text-anchor="middle">Refused</text>
<rect x="192" y="800" width="252" height="84" rx="12" fill="#FFFFFF" stroke="#D9CFBB" stroke-width="1.5"/>
