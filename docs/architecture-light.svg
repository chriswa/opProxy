<text x="318" y="93.0" font-size="15" font-weight="400" fill="#6B6252" text-anchor="middle">Claude Code, Codex, Cursor</text>
<path d="M318,110 L318,158" fill="none" stroke="#6B6252" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m-dim)"/>
<text x="332" y="140" font-size="15" font-weight="400" fill="#1F1B14" text-anchor="start" font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace">op …</text>
<rect x="192" y="160" width="252" height="70" rx="12" fill="#FFFFFF" stroke="#D9CFBB" stroke-width="1.5"/>
<text x="318" y="189" font-size="17" font-weight="600" fill="#1F1B14" text-anchor="middle"><tspan font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace">op</tspan> shim</text>
<text x="318" y="212" font-size="15" font-weight="400" fill="#6B6252" text-anchor="middle">opProxy's, first on PATH</text>
<path d="M318,230 L318,278" fill="none" stroke="#6B6252" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m-dim)"/>
<rect x="192" y="280" width="252" height="70" rx="12" fill="#FFFFFF" stroke="#D9CFBB" stroke-width="1.5"/>
<text x="318" y="310.0" font-size="17" font-weight="600" fill="#1F1B14" text-anchor="middle">opProxy daemon</text>
<text x="318" y="333.0" font-size="15" font-weight="400" fill="#6B6252" text-anchor="middle">on your Mac, sorts the command</text>
<rect x="508" y="272" width="268" height="86" rx="12" fill="#FBF7EE" stroke="#D9CFBB" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="524" y="300" font-size="15" font-weight="400" fill="#6B6252" text-anchor="start">Writes and anything else</text>
<text x="524" y="322" font-size="15" font-weight="400" fill="#6B6252" text-anchor="start">go to the real <tspan font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace">op</tspan>, which</text>
<text x="524" y="344" font-size="15" font-weight="400" fill="#6B6252" text-anchor="start">asks 1Password itself</text>
<path d="M444,315 L506,315" fill="none" stroke="#6B6252" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#m-dim)"/>
<path d="M318,350 L318,418" fill="none" stroke="#B07D00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m-acc)"/>
